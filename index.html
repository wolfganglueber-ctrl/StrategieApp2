<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2238" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="KnightyKnight – rundenbasiertes Strategiespiel" />
  <title>KnightyKnight</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="board"></canvas>

  <!-- Spiel-HUD -->
  <div id="hud" class="hidden">
    <div class="topbar">
      <button class="icon-btn" id="btnMenu" aria-label="Menü">☰</button>
      <div class="hud-mid">
        <div class="turninfo">
          <span class="dot" id="turnDot"></span>
          <span id="turnText">Runde 1</span>
        </div>
        <!-- Rohstoffe, Forschung und Armee in einer Reihe -->
        <div class="resrow">
          <div class="resbar" id="resBar"></div>
          <button class="pill tech" id="btnTech" title="Forschung">🔬 <b id="techText">0</b><span class="badge hidden" id="techBadge">0</span></button>
          <span class="pill units" title="Einheiten · Nahrung (und Holz), die deine Armee pro Runde verbraucht"><span>⚔ <b id="unitText">0</b></span><span class="upkeep">🌾<b id="upkeepText">−0</b><span id="upkeepWood"></span></span></span>
        </div>
        <!-- Testmodus: Rohstoffe der Gegner -->
        <div class="enemybar hidden" id="enemyBar"></div>
      </div>
    </div>
    <div id="banner" class="banner hidden"></div>
    <div class="bottom">
      <div class="panel-wrap">
        <div id="panel" class="panel"></div>
        <button id="panelX" class="panel-x hidden" aria-label="Schließen">✕</button>
      </div>
      <div class="actionbar">
        <button class="btn ghost" id="btnUndo" aria-label="Rückgängig">↶</button>
        <button class="btn ghost" id="btnTip" aria-label="Tipp">💡</button>
        <button class="btn ghost" id="btnNext">Nächste Einheit</button>
        <button class="btn primary" id="btnEnd">Zug beenden</button>
      </div>
    </div>
  </div>

  <!-- Hauptmenü -->
  <div id="scrMenu" class="screen">
    <div class="menu-box">
      <div class="logo">
        <!-- Logo (Quelle: icons/logo.svg) -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="logo-img" role="img" aria-label="KnightyKnight">
          <defs>
            <radialGradient id="kkSky" cx="50%" cy="38%" r="65%">
              <stop offset="0" stop-color="#2b4f8f" />
              <stop offset="0.55" stop-color="#142a55" />
              <stop offset="1" stop-color="#0a1530" />
            </radialGradient>
            <linearGradient id="kkGold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff1b0" />
              <stop offset="0.45" stop-color="#f5c542" />
              <stop offset="1" stop-color="#a86b12" />
            </linearGradient>
            <linearGradient id="kkSteel" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#5b6675" />
              <stop offset="0.28" stop-color="#e8edf3" />
              <stop offset="0.5" stop-color="#b9c3cf" />
              <stop offset="0.78" stop-color="#7d8896" />
              <stop offset="1" stop-color="#3d4652" />
            </linearGradient>
            <linearGradient id="kkSteelTop" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="kkCap" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4f7cff" />
              <stop offset="1" stop-color="#1d3fa8" />
            </linearGradient>
            <radialGradient id="kkMoonGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#fde68a" stop-opacity="0.55" />
              <stop offset="1" stop-color="#fde68a" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="kkPom" cx="40%" cy="35%" r="65%">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="1" stop-color="#cfd8ea" />
            </radialGradient>
            <clipPath id="kkHex"><polygon points="256,22 459,139 459,373 256,490 53,373 53,139" /></clipPath>
            <filter id="kkShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.45" />
            </filter>
          </defs>

          <!-- Goldener Sechseck-Rahmen -->
          <polygon points="256,6 473,131 473,381 256,506 39,381 39,131" fill="url(#kkGold)" />
          <polygon points="256,14 466,135 466,377 256,498 46,377 46,135" fill="#6b4310" />
          <polygon points="256,22 459,139 459,373 256,490 53,373 53,139" fill="url(#kkSky)" />

          <g clip-path="url(#kkHex)">
            <!-- Sterne -->
            <g fill="#fff8d6">
              <circle cx="120" cy="150" r="3" /><circle cx="160" cy="98" r="2" /><circle cx="96" cy="230" r="2.2" />
              <circle cx="410" cy="250" r="2.4" /><circle cx="380" cy="320" r="2" /><circle cx="130" cy="330" r="2.4" />
              <circle cx="230" cy="70" r="2" /><circle cx="300" cy="60" r="1.8" /><circle cx="90" cy="300" r="1.6" />
              <path d="M110 250 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" />
              <path d="M402 190 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" />
              <path d="M200 120 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.8" />
            </g>
            <!-- Hügel mit Burg im Mondlicht -->
            <path d="M40 420 Q150 360 256 392 Q370 352 480 410 L480 500 L40 500 Z" fill="#0b1a36" />
            <path d="M40 445 Q170 400 300 430 Q400 410 480 440 L480 500 L40 500 Z" fill="#081227" />
            <g fill="#0f2246">
              <rect x="352" y="356" width="44" height="40" /><rect x="346" y="346" width="12" height="18" /><rect x="372" y="340" width="12" height="22" /><rect x="390" y="346" width="12" height="18" />
              <polygon points="372,340 378,326 384,340" />
            </g>
            <rect x="374" y="364" width="6" height="9" fill="#fcd34d" opacity="0.85" />
          </g>

          <!-- Mond mit Schein -->
          <circle cx="392" cy="112" r="64" fill="url(#kkMoonGlow)" />
          <path d="M414 70 A46 46 0 1 0 422 154 A37 37 0 1 1 414 70 Z" fill="url(#kkGold)" />
          <circle cx="378" cy="104" r="4.5" fill="#d9a520" opacity="0.6" /><circle cx="370" cy="128" r="3" fill="#d9a520" opacity="0.55" />

          <!-- Zz -->
          <g fill="#fde68a" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic">
            <text x="132" y="178" font-size="38" opacity="0.95">Z</text>
            <text x="108" y="140" font-size="27" opacity="0.8">z</text>
            <text x="126" y="110" font-size="19" opacity="0.65">z</text>
          </g>

          <!-- Ritterhelm -->
          <g filter="url(#kkShadow)">
            <!-- Schlafmütze: hängt in Bogen zur Seite -->
            <path d="M166 210 Q166 140 236 112 Q300 88 350 112 Q404 140 410 214 Q412 240 404 262 Q394 232 380 214 Q372 190 350 176 Q348 206 346 214 Z" fill="url(#kkCap)" />
            <path d="M200 150 Q262 110 330 118" stroke="#e7eeff" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round" />
            <path d="M184 186 Q258 140 344 150" stroke="#e7eeff" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round" />
            <path d="M370 150 Q398 180 402 226" stroke="#e7eeff" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round" />
            <path d="M226 128 Q300 100 360 128" stroke="#9ab5ff" stroke-width="5" fill="none" opacity="0.6" stroke-linecap="round" />
            <circle cx="404" cy="272" r="24" fill="url(#kkPom)" stroke="#aebad3" stroke-width="2" />
            <circle cx="397" cy="265" r="8" fill="#ffffff" />

            <!-- Helmkörper (Topfhelm) -->
            <path d="M160 214 Q160 168 256 166 Q352 168 352 214 L352 352 Q352 384 316 396 L256 414 L196 396 Q160 384 160 352 Z" fill="url(#kkSteel)" stroke="#232a33" stroke-width="5" />
            <path d="M172 214 Q174 182 256 180 Q338 182 340 214 L340 236 L172 236 Z" fill="url(#kkSteelTop)" />
            <!-- Mützenrand mit weißem Saum -->
            <path d="M150 210 Q256 168 362 210 Q364 230 352 232 Q256 196 160 232 Q148 230 150 210 Z" fill="#f4f7ff" stroke="#9fb0cf" stroke-width="3" />
            <!-- Goldenes Kreuz als Verstärkung -->
            <rect x="244" y="228" width="24" height="182" rx="4" fill="url(#kkGold)" stroke="#7a4c0c" stroke-width="3" />
            <!-- Sehschlitz -->
            <path d="M178 276 Q256 262 334 276 L334 296 Q256 284 178 296 Z" fill="#121820" />
            <path d="M178 276 Q256 262 334 276" stroke="#f5c542" stroke-width="5" fill="none" />
            <path d="M178 298 Q256 286 334 298" stroke="#f5c542" stroke-width="5" fill="none" />
            <rect x="244" y="262" width="24" height="40" fill="url(#kkGold)" stroke="#7a4c0c" stroke-width="3" />
            <!-- Geschlossene, schlafende Augen hinter dem Schlitz -->
            <path d="M196 284 Q210 292 224 284" stroke="#fde68a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9" />
            <path d="M288 284 Q302 292 316 284" stroke="#fde68a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9" />
            <!-- Atemlöcher -->
            <g fill="#1a2028">
              <circle cx="206" cy="336" r="5" /><circle cx="222" cy="352" r="5" /><circle cx="206" cy="364" r="5" />
              <circle cx="306" cy="336" r="5" /><circle cx="290" cy="352" r="5" /><circle cx="306" cy="364" r="5" />
            </g>
            <!-- Nieten -->
            <g fill="#f5c542" stroke="#7a4c0c" stroke-width="1.5">
              <circle cx="180" cy="250" r="5" /><circle cx="332" cy="250" r="5" /><circle cx="180" cy="330" r="5" /><circle cx="332" cy="330" r="5" />
              <circle cx="256" cy="398" r="5" />
            </g>
            <!-- Glanzlicht -->
            <path d="M186 312 Q182 250 200 238" stroke="#ffffff" stroke-width="7" fill="none" opacity="0.5" stroke-linecap="round" />
          </g>
        </svg>
        <h1>KnightyKnight</h1>
        <p class="sub">Erobere das Reich – Zug um Zug</p>
      </div>
      <button class="btn primary big hidden" id="btnContinue">Fortsetzen</button>
      <button class="btn primary big" id="btnCampaign">Kampagne</button>
      <button class="btn big" id="btnDefense">🏰 Burgverteidigung</button>
      <button class="btn big" id="btnSkirmish">Freies Spiel</button>
      <button class="btn big" id="btnLoad">📂 Laden</button>
      <button class="btn big" id="btnFog">🌫️ Nebel: Aus</button>
      <button class="btn big" id="btnHelp">Anleitung</button>
      <button class="btn ghost" id="btnSettings">Einstellungen</button>
      <p class="version">Version 0.96</p>
    </div>
  </div>

  <!-- Levelauswahl -->
  <div id="scrLevels" class="screen hidden">
    <div class="screen-head">
      <button class="icon-btn" data-back>←</button>
      <h2>Kampagne</h2>
      <span class="stars-total" id="starsTotal"></span>
    </div>
    <div class="tabs" id="worldTabs"></div>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <!-- Freies Spiel -->
  <div id="scrSetup" class="screen hidden">
    <div class="screen-head">
      <button class="icon-btn" data-back>←</button>
      <h2>Freies Spiel</h2>
      <span></span>
    </div>
    <div class="form">
      <label>Kartengröße</label>
      <div class="seg" id="segSize"></div>
      <label>Landschaft</label>
      <div class="seg" id="segBiome"></div>
      <label>Gegner</label>
      <div class="seg" id="segEnemies"></div>
      <label>Schwierigkeit</label>
      <div class="seg" id="segDiff"></div>
      <p class="hint" id="diffDesc"></p>
      <label>Städte auf der Karte <small id="citiesInfo"></small></label>
      <input type="range" id="citiesRange" class="range" min="0" max="2" step="1" />
      <label>Karten-Code <small>(gleicher Code = gleiche Karte, zum Teilen)</small></label>
      <div class="seedrow">
        <input id="seedInput" maxlength="12" autocomplete="off" spellcheck="false" />
        <button class="btn" id="btnDice" aria-label="Neuer Code">🎲</button>
      </div>
      <button class="btn primary big" id="btnStartSkirmish">Spiel starten</button>
    </div>
  </div>

  <!-- Anleitung -->
  <div id="scrHelp" class="screen hidden">
    <div class="screen-head">
      <button class="icon-btn" data-back>←</button>
      <h2>Anleitung</h2>
      <span></span>
    </div>
    <div class="help" id="helpContent"></div>
  </div>

  <!-- Dialog -->
  <div id="modal" class="modal hidden">
    <div class="modal-box" id="modalBox"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
